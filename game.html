<header class="page-head"><h1>小遊戲</h1><p class="page-head__sub">用七款半導體主題小遊戲喘口氣——配對晶片、挑戰論壇快問快答、分類晶圓、合成製程節點、晶圓掃雷、排製程順序、記製程配方。</p></header><div class="arcade"><div class="arcade__menu grid is-in" data-reveal=""><button class="card gamecard" type="button" data-game="memory" aria-label="晶片記憶配對"><span class="gamecard__icon material-symbols-rounded" aria-hidden="true">style</span><span class="gamecard__go material-symbols-rounded" aria-hidden="true">play_arrow</span><h2 class="gamecard__title">晶片記憶配對</h2><p class="gamecard__desc">翻牌配對半導體技術圖示。</p></button><button class="card gamecard" type="button" data-game="quiz" aria-label="論壇快問快答"><span class="gamecard__icon material-symbols-rounded" aria-hidden="true">quiz</span><span class="gamecard__go material-symbols-rounded" aria-hidden="true">play_arrow</span><h2 class="gamecard__title">論壇快問快答</h2><p class="gamecard__desc">用展會自己的論壇、特區與數據自動出題。</p></button><button class="card gamecard" type="button" data-game="sorter" aria-label="晶圓分類反應"><span class="gamecard__icon material-symbols-rounded" aria-hidden="true">swap_horiz</span><span class="gamecard__go material-symbols-rounded" aria-hidden="true">play_arrow</span><h2 class="gamecard__title">晶圓分類反應</h2><p class="gamecard__desc">在時間歸零前,快速判斷良品與破裂晶圓並左右分類。</p></button><button class="card gamecard" type="button" data-game="node2048" aria-label="節點合成 2048"><span class="gamecard__icon material-symbols-rounded" aria-hidden="true">grid_4x4</span><span class="gamecard__go material-symbols-rounded" aria-hidden="true">play_arrow</span><h2 class="gamecard__title">節點合成 2048</h2><p class="gamecard__desc">合成製程節點,把 28nm 一路微縮到 2nm 的 2048 玩法。</p></button><button class="card gamecard" type="button" data-game="sweeper" aria-label="晶圓掃雷"><span class="gamecard__icon material-symbols-rounded" aria-hidden="true">bug_report</span><span class="gamecard__go material-symbols-rounded" aria-hidden="true">play_arrow</span><h2 class="gamecard__title">晶圓掃雷</h2><p class="gamecard__desc">晶圓版踩地雷——揭開所有良品晶粒，別踩到暗藏的缺陷。</p></button><button class="card gamecard" type="button" data-game="flow" aria-label="製程排序"><span class="gamecard__icon material-symbols-rounded" aria-hidden="true">linear_scale</span><span class="gamecard__go material-symbols-rounded" aria-hidden="true">play_arrow</span><h2 class="gamecard__title">製程排序</h2><p class="gamecard__desc">把製程步驟排回正確順序——從裸晶圓到測完的晶片。</p></button><button class="card gamecard" type="button" data-game="recipe" aria-label="製程配方記憶"><span class="gamecard__icon material-symbols-rounded" aria-hidden="true">sensors</span><span class="gamecard__go material-symbols-rounded" aria-hidden="true">play_arrow</span><h2 class="gamecard__title">製程配方記憶</h2><p class="gamecard__desc">看製程配方依序亮起，再照同樣順序按回去；每一輪多加一步。</p></button></div></div>
